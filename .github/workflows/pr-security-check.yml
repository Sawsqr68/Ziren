name: PR Security Check

on:
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  security-check:
    name: Security Check for PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Quick Security Scan
        run: |
          # Install tools
          cargo install cargo-audit --locked
          
          # Run checks
          echo "## 🔒 Security Check Results" > comment.md
          echo "" >> comment.md
          
          echo "### Dependency Vulnerabilities" >> comment.md
          if cargo audit 2>&1 | tee audit.log; then
            echo "✅ No vulnerabilities found" >> comment.md
          else
            echo "⚠️ Vulnerabilities detected:" >> comment.md
            cat audit.log >> comment.md
          fi
          echo "" >> comment.md
          
          echo "### Clippy Security Lints" >> comment.md
          if cargo clippy --all-targets -- -W clippy::unwrap_used -W clippy::panic 2>&1 | tee clippy.log; then
            echo "✅ No security issues found" >> comment.md
          else
            echo "⚠️ Security lints triggered:" >> comment.md
            cat clippy.log >> comment.md
          fi
      
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
