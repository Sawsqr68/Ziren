# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
]
deny = [
    "GPL-3.0",
    "AGPL-3.0",
]
copyleft = "warn"
allow-osi-fsf-free = "neither"
default = "deny"
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/ProjectZKM/Plonky3",
    "https://github.com/ziren-patches/curve25519-dalek",
    "https://github.com/ziren-patches/signatures",
    "https://github.com/ziren-patches/RustCrypto-RSA",
    "https://github.com/ziren-patches/rust-secp256k1",
    "https://github.com/ziren-patches/RustCrypto-hashes",
    "https://github.com/ziren-patches/bn",
    "https://github.com/ziren-patches/elliptic-curves",
]

[sources.allow-org]
github = ["ProjectZKM", "ziren-patches"]
